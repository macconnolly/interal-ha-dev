# =============================================================================
# Tunet Home v2 — Variant-aware composition (2026-05-23 redesign)
# =============================================================================
# Plan F of tunet-portfolio-roadmap-2026-05-23.md.
#
# REDESIGN AFTER MAC'S 2026-05-23 FEEDBACK:
#   "Why aren't we using any of the variations of the cards like Compact
#    Rows large etcetera? We have so many permutations of them which is
#    why we have a full page with every single permutation of every
#    single card in every variation humanly possible for us to draw on?"
#
# Variant choices per card-position:
#
#   ACTIONS         mode_strip + compact            (one row, mode-aware chips)
#   SCENES          strip variant                   (3-scene quick cycle)
#   STATUS (top)    home_summary variant            (4x2 tile matrix)
#   STATUS (rooms)  room_row variant                (compact per-room state)
#   STATUS (info)   info_only variant               (passive HVAC info)
#   ROOMS           row variant                     (rich per-room with orbs + counts)
#   LIGHTING        grid layout, tile_size compact  (6 zones, 3x2)
#   LIGHT_TILE      horizontal direct tiles         (kitchen counter, entry, key)
#   CLIMATE         thin variant                    (less prominent than gold-standard)
#   WEATHER         compact + flip-chips            (header info, less screen real estate)
#   SENSOR          row variant                     (environment graph row)
#   MEDIA           default + show_progress         (transport + art)
#   SONOS           desktop variant only via popup  (mobile uses media+grid)
#   SPEAKER_GRID    columns:5 + group_actions       (per-speaker)
#   NAV             chrome only
#   INBOX           default (conditional render)
#   ALARM           via status home_summary + popup (alarms list in #room-bedroom popup)
#
# Architecture:
#   - type: sections with max_columns: 4
#   - grid_options: { columns: full } on every card → cards span section width
#   - column_span tuned for desktop multi-column (climate/weather side-by-side,
#     lighting/rooms side-by-side, media/speakers side-by-side)
#
# Sensors consumed (Plan B):
#   sensor.hvac_running, hvac_setpoint_drift_high/low, hvac_heating/cooling_minutes_today
#   sensor.oal_mode_current (with age attribute), oal_override_count_active
#   binary_sensor.occupancy_<room>
#   (lights_on_<room> de-prioritized per Mac 2026-05-23)
#
# Scenes consumed (Plan C):
#   scene.tunet_oal_adaptive / dim_ambient_plus / dim_ambient / sleep / full_bright
#
# Bubble Card 3.2.1 popups (top-level cards in hidden view):
#   #room-living-room, #room-kitchen, #room-dining-room, #room-bedroom, #room-office
#   #media-living-room, #oal-detail
# =============================================================================

title: Tunet Home v2
icon: mdi:home-variant

views:

  # ────────────────────────────────────────────────────────────────────
  # VIEW: HOME (overview)
  # ────────────────────────────────────────────────────────────────────
  - title: Home
    path: home
    icon: mdi:home
    type: sections
    max_columns: 4
    dense_section_placement: false
    sections:

      # ── ACTIONS strip (compact mode-aware) ──────────────────────────
      - type: grid
        column_span: 4
        cards:
          - type: custom:tunet-actions-card
            variant: mode_strip
            compact: true
            mode_entity: input_select.oal_active_configuration
            grid_options:
              columns: full
            actions:
              - name: All On
                icon: lightbulb
                accent: amber
                service: light.turn_on
                service_data:
                  entity_id: light.all_adaptive_lights
                state_entity: light.all_adaptive_lights
                active_when: 'on'
              - name: All Off
                icon: power_settings_new
                accent: amber
                service: light.turn_off
                service_data:
                  entity_id: light.all_adaptive_lights
                state_entity: light.all_adaptive_lights
                active_when: 'off'
              - name: Bedtime
                icon: bedtime
                accent: amber
                service: scene.turn_on
                service_data:
                  entity_id: scene.tunet_oal_dim_ambient_plus
                state_entity: input_select.oal_active_configuration
                active_when: Dim Ambient Plus
              - name: Sleep
                icon: bed
                accent: amber
                service: scene.turn_on
                service_data:
                  entity_id: scene.tunet_oal_sleep
                state_entity: input_select.oal_active_configuration
                active_when: Sleep

      # ── SCENES strip (3-cycle scenes for tap-access) ─────────────────
      - type: grid
        column_span: 4
        cards:
          - type: custom:tunet-scenes-card
            variant: strip
            name: Scenes
            grid_options:
              columns: full
            scenes:
              - entity: scene.tunet_oal_adaptive
                name: Adaptive
                icon: wb_sunny
              - entity: scene.tunet_oal_dim_ambient_plus
                name: Dim+
                icon: bedtime
              - entity: scene.tunet_oal_dim_ambient
                name: Dim
                icon: nightlight
              - entity: scene.tunet_oal_sleep
                name: Sleep
                icon: bed
              - entity: scene.tunet_oal_full_bright
                name: Bright
                icon: lightbulb

      # ── STATUS home_summary (4x2 tile matrix) ────────────────────────
      - type: grid
        column_span: 4
        cards:
          - type: custom:tunet-status-card
            layout_variant: home_summary
            name: Home Status
            columns: 4
            tile_size: compact
            grid_options:
              columns: full
            tiles:
              - type: value
                entity: sensor.oal_system_status
                icon: psychology
                label: Adaptive
                accent: blue
                attribute: zones_adaptive
                format: integer
                tap_action:
                  action: navigate
                  navigation_path: '#oal-detail'
              - type: value
                entity: sensor.oal_override_count_active
                icon: pan_tool
                label: Manual
                accent: red
                format: integer
              - type: value
                entity: sensor.oal_mode_current
                icon: tune
                label: Mode
                accent: green
                attribute: age_human
                tap_action:
                  action: navigate
                  navigation_path: '#oal-detail'
              - type: value
                entity: binary_sensor.hvac_running
                icon: hvac
                label: HVAC
                accent: blue
                format: state
              - type: value
                entity: sensor.dining_room_temperature
                icon: device_thermostat
                label: Inside
                accent: amber
                unit: °F
                format: integer
              - type: value
                entity: weather.home
                icon: cloud
                label: Outside
                accent: blue
                attribute: temperature
                format: integer
              - type: value
                entity: sensor.kitchen_humidity
                icon: water_drop
                label: Humidity
                accent: blue
                unit: '%'
                format: integer
              - type: value
                entity: sensor.aqi
                icon: air
                label: AQI
                accent: green
                format: integer

      # ── CLIMATE thin + WEATHER (side-by-side desktop, stacked phone) ─
      - type: grid
        column_span: 2
        cards:
          - type: custom:tunet-climate-card
            entity: climate.dining_room
            name: Climate
            variant: thin
            grid_options:
              columns: full
      - type: grid
        column_span: 2
        cards:
          - type: custom:tunet-weather-card
            entity: weather.home
            name: Weather
            forecast_days: 5
            view_mode: daily
            metric_mode: temperature
            show_pressure: false
            show_last_updated: false
            grid_options:
              columns: full

      # ── LIGHTING grid (compact 3-col 2-row) ──────────────────────────
      - type: grid
        column_span: 4
        cards:
          - type: custom:tunet-lighting-card
            name: Lighting
            surface: section
            layout: grid
            columns: 3
            rows: 2
            tile_size: compact
            expand_groups: false
            show_adaptive_toggle: false
            adaptive_entity: switch.adaptive_lighting_main_living
            primary_entity: sensor.oal_system_status
            grid_options:
              columns: full
            zones:
              - entity: light.main_living_lights
                name: Living
                icon: lightbulb
              - entity: light.kitchen_island_lights
                name: Kitchen
                icon: kitchen
              - entity: light.bedroom_primary_lights
                name: Bedroom
                icon: bed
              - entity: light.accent_spots_lights
                name: Spots
                icon: flashlight_on
              - entity: light.recessed_ceiling_lights
                name: Ceiling
                icon: light
              - entity: light.column_lights
                name: Columns
                icon: view_column

      # ── ROOMS row variant (rich per-room with orbs + counts) ─────────
      - type: grid
        column_span: 4
        cards:
          - type: custom:tunet-rooms-card
            name: Rooms
            layout_variant: row
            tile_size: standard
            grid_options:
              columns: full
            rooms:
              - name: Living Room
                icon: weekend
                temperature_entity: sensor.dining_room_temperature
                tap_action:
                  action: navigate
                  navigation_path: '#room-living-room'
                lights:
                  - light.living_room_couch_lamp
                  - light.living_room_floor_lamp
                  - light.living_room_spot_lights
                  - light.living_room_credenza_light
              - name: Kitchen
                icon: kitchen
                tap_action:
                  action: navigate
                  navigation_path: '#room-kitchen'
                lights:
                  - light.kitchen_island_pendants
                  - light.kitchen_main_lights
                  - light.kitchen_counter_cabinet_underlights
              - name: Dining Room
                icon: restaurant
                temperature_entity: sensor.dining_room_temperature
                tap_action:
                  action: navigate
                  navigation_path: '#room-dining-room'
                lights:
                  - light.dining_room_spot_lights
                  - light.dining_column_strip_light_matter
              - name: Bedroom
                icon: bed
                temperature_entity: sensor.bedroom_temp_humidity_sensor_temperature
                tap_action:
                  action: navigate
                  navigation_path: '#room-bedroom'
                lights:
                  - light.master_presence
                  - light.master_bedroom_corner_accent_govee
                  - light.master_bedroom_table_lamps
              - name: Office
                icon: desktop_windows
                tap_action:
                  action: navigate
                  navigation_path: '#room-office'
                lights:
                  - light.office_desk_lamp
                  - light.office_bed_lights

      # ── KEY LIGHT TILES (horizontal direct access) ───────────────────
      # Demonstrates tunet-light-tile horizontal variant. Quick access
      # to the lights Mac touches most outside the room context.
      - type: grid
        column_span: 2
        cards:
          - type: custom:tunet-light-tile
            entity: light.kitchen_counter_cabinet_underlights
            name: Counter
            orientation: horizontal
            tile_size: standard
            grid_options:
              columns: full
      - type: grid
        column_span: 2
        cards:
          - type: custom:tunet-light-tile
            entity: light.entryway_lamp
            name: Entry Lamp
            orientation: horizontal
            tile_size: standard
            grid_options:
              columns: full

      # ── INFO_ONLY status (passive HVAC + setpoint info) ──────────────
      - type: grid
        column_span: 4
        cards:
          - type: custom:tunet-status-card
            layout_variant: info_only
            name: System
            columns: 4
            tile_size: compact
            grid_options:
              columns: full
            tiles:
              - type: value
                entity: sensor.hvac_heating_minutes_today
                icon: local_fire_department
                label: Heating
                accent: red
                unit: min
                format: integer
              - type: value
                entity: sensor.hvac_cooling_minutes_today
                icon: ac_unit
                label: Cooling
                accent: blue
                unit: min
                format: integer
              - type: value
                entity: sensor.hvac_setpoint_drift_high
                icon: trending_up
                label: ΔHigh
                accent: red
                unit: °F
              - type: value
                entity: sensor.hvac_setpoint_drift_low
                icon: trending_down
                label: ΔLow
                accent: blue
                unit: °F

      # ── MEDIA + SPEAKERS (side-by-side desktop) ──────────────────────
      - type: grid
        column_span: 2
        cards:
          - type: custom:tunet-media-card
            entity: media_player.living_room
            name: Sonos
            show_progress: true
            grid_options:
              columns: full
            tap_action:
              action: navigate
              navigation_path: '#media-living-room'
      - type: grid
        column_span: 2
        cards:
          - type: custom:tunet-speaker-grid-card
            entity: media_player.living_room
            name: Speakers
            coordinator_sensor: sensor.sonos_smart_coordinator
            columns: 5
            show_group_actions: true
            grid_options:
              columns: full
            speakers:
              - entity: media_player.living_room
                name: Living Room
              - entity: media_player.dining_room
                name: Dining Room
              - entity: media_player.kitchen
                name: Kitchen
              - entity: media_player.bathroom
                name: Bathroom
              - entity: media_player.master_bedroom
                name: Bedroom

      # ── INBOX (full width when items present) ────────────────────────
      - type: grid
        column_span: 4
        cards:
          - type: custom:tunet-inbox-card
            name: Inbox
            grid_options:
              columns: full

  # ────────────────────────────────────────────────────────────────────
  # VIEW: SYSTEM (graphs + OAL detail)
  # ────────────────────────────────────────────────────────────────────
  - title: System
    path: system
    icon: mdi:chart-line
    type: sections
    max_columns: 4
    sections:
      - type: grid
        column_span: 4
        cards:
          - type: custom:tunet-status-card
            layout_variant: home_detail
            name: OAL Detail
            columns: 2
            tile_size: standard
            grid_options:
              columns: full
            tiles:
              - type: dropdown
                entity: input_select.oal_active_configuration
                label: Mode
                icon: tune
                accent: green
              - type: value
                entity: sensor.oal_mode_current
                label: Active For
                icon: timer
                accent: blue
                attribute: age_human
              - type: value
                entity: sensor.oal_override_count_active
                label: Active Overrides
                icon: pan_tool
                accent: red
                format: integer
              - type: value
                entity: sensor.oal_global_brightness_offset
                label: Boost
                icon: tune
                accent: amber
                attribute: total_offset
                format: integer

      - type: grid
        column_span: 4
        cards:
          - type: custom:tunet-sensor-card
            title: HVAC Today
            icon: hvac
            icon_color: amber
            show_sparkline: true
            show_trend: true
            grid_options:
              columns: full
            sensors:
              - entity: sensor.hvac_heating_minutes_today
                label: Heating Minutes
                icon: local_fire_department
                accent: red
                unit: min
              - entity: sensor.hvac_cooling_minutes_today
                label: Cooling Minutes
                icon: ac_unit
                accent: blue
                unit: min
              - entity: sensor.hvac_setpoint_drift_high
                label: Above Setpoint
                icon: trending_up
                accent: red
                unit: °F
              - entity: sensor.hvac_setpoint_drift_low
                label: Below Setpoint
                icon: trending_down
                accent: blue
                unit: °F

  # ════════════════════════════════════════════════════════════════════
  # POPUPS view (hidden from sidebar; popups invoked via hash)
  # ════════════════════════════════════════════════════════════════════

  - title: Popups
    path: popups
    icon: mdi:dots-horizontal
    visible: false
    cards:

      - type: custom:bubble-card
        card_type: pop-up
        hash: '#room-living-room'
        popup_mode: fit-content
        name: Living Room
        icon: mdi:sofa
        bottom_offset: true
        cards:
          - type: custom:tunet-lighting-card
            name: Living Room Lights
            surface: section
            layout: grid
            columns: 2
            tile_size: large
            zones:
              - entity: light.living_room_couch_lamp
                name: Couch
                icon: lamp
              - entity: light.living_room_floor_lamp
                name: Floor
                icon: lamp
              - entity: light.living_room_spot_lights
                name: Spots
                icon: flashlight_on
              - entity: light.living_room_credenza_light
                name: Credenza
                icon: light
          - type: custom:tunet-sensor-card
            title: Living Room
            sensors:
              - entity: sensor.dining_room_temperature
                label: Temperature
                icon: thermostat
                accent: amber
                unit: °F
              - entity: binary_sensor.occupancy_living_room
                label: Occupancy
                icon: sensor_occupied
                accent: green

      - type: custom:bubble-card
        card_type: pop-up
        hash: '#room-kitchen'
        popup_mode: fit-content
        name: Kitchen
        icon: mdi:silverware
        bottom_offset: true
        cards:
          - type: custom:tunet-lighting-card
            name: Kitchen Lights
            surface: section
            layout: grid
            columns: 3
            tile_size: large
            zones:
              - entity: light.kitchen_island_pendants
                name: Island
                icon: light
              - entity: light.kitchen_main_lights
                name: Main
                icon: light
              - entity: light.kitchen_counter_cabinet_underlights
                name: Under
                icon: linear_scale
          - type: custom:tunet-sensor-card
            title: Kitchen
            sensors:
              - entity: sensor.kitchen_humidity
                label: Humidity
                icon: water_drop
                accent: blue
                unit: '%'
              - entity: binary_sensor.occupancy_kitchen
                label: Occupancy
                icon: sensor_occupied
                accent: green

      - type: custom:bubble-card
        card_type: pop-up
        hash: '#room-dining-room'
        popup_mode: fit-content
        name: Dining Room
        icon: mdi:silverware-clean
        bottom_offset: true
        cards:
          - type: custom:tunet-climate-card
            entity: climate.dining_room
            name: Climate
          - type: custom:tunet-lighting-card
            name: Dining Lights
            surface: section
            layout: grid
            columns: 2
            tile_size: large
            zones:
              - entity: light.dining_room_spot_lights
                name: Spots
                icon: flashlight_on
              - entity: light.dining_column_strip_light_matter
                name: Column
                icon: view_column

      - type: custom:bubble-card
        card_type: pop-up
        hash: '#room-bedroom'
        popup_mode: fit-content
        name: Bedroom
        icon: mdi:bed
        bottom_offset: true
        cards:
          - type: custom:tunet-lighting-card
            name: Bedroom Lights
            surface: section
            layout: grid
            columns: 2
            tile_size: large
            zones:
              - entity: light.master_presence
                name: Main
                icon: bed
              - entity: light.master_bedroom_corner_accent_govee
                name: Accent
                icon: nightlight
              - entity: light.master_bedroom_table_lamps
                name: Lamps
                icon: lamp
          - type: custom:tunet-sensor-card
            title: Bedroom
            sensors:
              - entity: sensor.bedroom_temp_humidity_sensor_temperature
                label: Temperature
                icon: thermostat
                accent: amber
                unit: °F
              - entity: sensor.bedroom_temp_humidity_sensor_humidity
                label: Humidity
                icon: water_drop
                accent: blue
                unit: '%'
              - entity: binary_sensor.occupancy_master_bedroom
                label: Occupancy
                icon: sensor_occupied
                accent: green
          - type: custom:tunet-alarm-card
            name: Alarms

      - type: custom:bubble-card
        card_type: pop-up
        hash: '#room-office'
        popup_mode: fit-content
        name: Office
        icon: mdi:desktop-mac
        bottom_offset: true
        cards:
          - type: custom:tunet-lighting-card
            name: Office Lights
            surface: section
            layout: grid
            columns: 2
            tile_size: large
            zones:
              - entity: light.office_desk_lamp
                name: Desk
                icon: lamp
              - entity: light.office_bed_lights
                name: Office Bed
                icon: bed
          - type: custom:tunet-sensor-card
            title: Office
            sensors:
              - entity: binary_sensor.occupancy_office
                label: Occupancy
                icon: sensor_occupied
                accent: green

      - type: custom:bubble-card
        card_type: pop-up
        hash: '#media-living-room'
        popup_mode: fit-content
        name: Media
        icon: mdi:speaker
        bottom_offset: true
        cards:
          - type: custom:tunet-sonos-card
            entity: media_player.living_room
            name: Now Playing
          - type: custom:tunet-speaker-grid-card
            entity: media_player.living_room
            coordinator_sensor: sensor.sonos_smart_coordinator
            columns: 5
            show_group_actions: true
            speakers:
              - entity: media_player.living_room
                name: Living Room
              - entity: media_player.dining_room
                name: Dining Room
              - entity: media_player.kitchen
                name: Kitchen
              - entity: media_player.bathroom
                name: Bathroom
              - entity: media_player.master_bedroom
                name: Bedroom

      - type: custom:bubble-card
        card_type: pop-up
        hash: '#oal-detail'
        popup_mode: fit-content
        name: OAL System
        icon: mdi:tune
        bottom_offset: true
        cards:
          - type: custom:tunet-status-card
            layout_variant: home_detail
            name: OAL
            columns: 2
            tile_size: standard
            tiles:
              - type: dropdown
                entity: input_select.oal_active_configuration
                label: Active Mode
                icon: tune
                accent: green
              - type: value
                entity: sensor.oal_mode_current
                label: Active For
                icon: timer
                accent: blue
                attribute: age_human
          - type: custom:tunet-scenes-card
            variant: wrap
            name: Quick Scenes
            scenes:
              - entity: scene.tunet_oal_adaptive
                name: Adaptive
                icon: wb_sunny
              - entity: scene.tunet_oal_dim_ambient_plus
                name: Dim+
                icon: bedtime
              - entity: scene.tunet_oal_dim_ambient
                name: Dim
                icon: nightlight
              - entity: scene.tunet_oal_sleep
                name: Sleep
                icon: bed
              - entity: scene.tunet_oal_full_bright
                name: Bright
                icon: lightbulb
