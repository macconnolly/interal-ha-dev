        actions:
        - name: Open Room
          icon: open_in_new
          accent: blue
          tap_action:
            action: navigate
            navigation_path: /tunet-home-v2/living-room
        - name: All Off
          icon: power_settings_new
          accent: amber
          service: light.turn_off
