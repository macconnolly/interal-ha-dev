      name: Scenes
      allow_wrap: false
      grid_options:
        columns: full
      scenes:
      - entity: scene.tunet_oal_adaptive
        name: Adaptive
        icon: wb_sunny
      - entity: scene.tunet_oal_evening
        name: Evening
        icon: bedtime
