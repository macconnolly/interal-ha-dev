# =============================================================================
# TUNET OAL Extracted Sensors — first-class sensors for values currently
# buried as attributes on sensor.oal_real_time_monitor + sensor.oal_environmental_debug
# =============================================================================
# Scope: Tranche S.1b + S.1c #lux (per docs/plans/S1-sensor-package-2026-05-26.md)
#
# Source: sensor.oal_real_time_monitor is OAL's diagnostic blob carrying 40+
#   attributes including per-zone effective brightness ranges, manual offsets,
#   and global brightness offsets. Adaptive dashboard page cannot render
#   brightness band visualizations without these as first-class sensors.
#   Live verified 2026-05-26 — all attribute names match plan exactly.
#
# Inventory source: see plan Appendix A for adversarial-review-confirmed
# attribute paths in packages/oal_lighting_control_package.yaml:8724-8825.
#
# Office_bed zone INTENTIONALLY excluded per Mac's "sensor fused with office"
# direction (2026-05-26 5:15pm) — office_bed is treated as part of the office
# zone for dashboard purposes; no separate sensors exposed.
#
# All sensors are read-only template pulls from existing attributes — no
# modification to source sensors, no automation triggers.
# =============================================================================

template:
  - sensor:

      # ─── Per-zone effective minimum brightness (8 sensors) ─────────────
      - name: "OAL Zone Main Living Effective Min"
        unique_id: "tunet_oal_zone_main_living_effective_min_pct"
        icon: mdi:brightness-7
        unit_of_measurement: "%"
        state_class: measurement
        state: >
          {{ state_attr('sensor.oal_real_time_monitor', 'main_living_effective_min_brightness_pct') | float(none) | round(1) }}

      - name: "OAL Zone Kitchen Island Effective Min"
