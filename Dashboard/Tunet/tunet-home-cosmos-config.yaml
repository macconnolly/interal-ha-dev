          }\nha-card::before {\n  content: '';\n  position: absolute;\n  top: 8px; left: 50%;\n  transform: translateX(-50%);\n  width: 36px; height: 5px;\n  border-radius: 3px;\n  background: rgba(255,255,255,0.4);\n\
          \  pointer-events: none;\n}\n"
      cards:
      - type: custom:tunet-lighting-card
        name: Living Room Lights
        surface: section
        layout: grid
        columns: 2
        tile_size: standard
        zones:
        - entity: light.living_room_couch_lamp
          name: Couch
          icon: table_lamp
        - entity: light.living_room_floor_lamp
          name: Floor
          icon: floor_lamp
        - entity: light.living_room_spot_lights
          name: Spots
          icon: flashlight_on
        - entity: light.living_room_credenza_light
          name: Credenza
          icon: wb_incandescent
        - entity: light.living_column_strip_light_matter
          name: Column
          icon: view_column
      - type: custom:tunet-sensor-card
        title: Living Room
        sensors:
        - entity: sensor.dining_room_temperature
          label: Temperature
          icon: device_thermostat
          accent: amber
          unit: °F
        - entity: binary_sensor.occupancy_living_room
          label: Occupancy
          icon: sensor_occupied
          accent: green
      - type: custom:tunet-actions-card
        variant: compact
        actions:
        - name: Open Room
          icon: open_in_new
          accent: blue
          tap_action:
            action: navigate
            navigation_path: /tunet-home-cosmos/living-room
        - name: All Off
          icon: power_settings_new
          accent: amber
          service: light.turn_off
          service_data:
            entity_id:
              - light.living_room_couch_lamp
              - light.living_room_floor_lamp
              - light.living_room_spot_lights
              - light.living_room_credenza_light
              - light.living_column_strip_light_matter
        - name: All On
          icon: lightbulb
          accent: amber
          service: light.turn_on
          service_data:
            entity_id:
              - light.living_room_couch_lamp
              - light.living_room_floor_lamp
              - light.living_room_spot_lights
              - light.living_room_credenza_light
              - light.living_column_strip_light_matter
  - type: grid
    column_span: 4
    cards:
    - type: custom:bubble-card
      card_type: pop-up
      hash: '#room-kitchen'
      popup_mode: fit-content
      width_desktop: 720px
      margin_top_desktop: 3vh
      bg_opacity: 92
