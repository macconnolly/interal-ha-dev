# =============================================================================
# Tunet Home v2 — Plan F build (2026-05-23 ultrathink approved)
# =============================================================================
# Plan: docs/plans/tunet-home-v2-interaction-spec-2026-05-23.md (approved 2ce7e22)
# Backend: commit 6caad51 (Evening rename + 19 new sensors)
#
# Composition per plan §4 + §11:
#   HOME view (sections grid, max_columns: 4)
#     - Status row (home_summary 4×2, 8 tiles)
#     - Scenes strip (3 scenes large: Adaptive / Evening / Dim Ambient)
#     - Rooms row (5 rooms, row variant with orbs + chevron)
#     - Now Playing mini-player
#     - Quick Lights (Counter + Entry direct tiles)
#     - Actions strip (Bedtime / Sleep / All Off)
#     - Inbox (conditional)
#
#   STATS view (HVAC + Electricity + Outside)
#   ADAPTIVE view (OAL mode timeline + per-zone snapshot)
#   POPUPS view (7 Bubble Card 3.2.1 standalone popups, hidden from sidebar)
#
# Interactions (Plan §1 + §5 per Apple HIG tap-vs-long-press):
#   Tap on rooms row body         → open #room-<name> Bubble popup
#   Tap on rooms orb              → toggle single light
#   Tap on rooms power icon       → toggle all room lights
#   Tap on status tile (Mode etc) → open #oal-detail popup
#   Tap on Now Playing            → open #media-living-room popup
#   Tap on scene chip             → activate scene
#   Tap on Quick Light tile       → toggle; long-drag → brightness
#
# Bubble Card popups styled with card_mod CSS for iOS-sheet feel
# (grabber + spring-ish transition + safe-area bottom inset).
# Mac's suggestion 2026-05-23 to style Bubble Card popups Apple-like
# rather than reverting to Browser Mod.
# =============================================================================

title: Tunet Home v2
icon: mdi:home
views:
- title: Home
  path: home
  icon: mdi:home
  type: sections
  max_columns: 4
  dense_section_placement: true
  sections:
  - type: grid
    column_span: 4
    cards:
    - type: custom:tunet-status-card
      layout_variant: home_summary
      name: Home Status
      columns: 4
      tile_size: compact
      grid_options:
        columns: full
      tiles:
      - type: value
        entity: sensor.oal_mode_current
        icon: tune
        label: Mode
        accent: green
        attribute: age_human
        tap_action:
          action: navigate
          navigation_path: '#oal-detail'
      - type: value
        entity: binary_sensor.hvac_running
        attribute: hvac_action
        icon: hvac
        label: HVAC
        accent: blue
        tap_action:
          action: more-info
          entity: climate.dining_room
      - type: value
        entity: sensor.dining_room_temperature
        icon: device_thermostat
        label: Inside
        accent: amber
        unit: °F
        format: integer
      - type: value
        entity: sensor.outside_temperature
        icon: cloud
        label: Outside
        accent: blue
        unit: °F
        format: integer
      - type: value
        entity: sensor.oal_override_count_active
        icon: pan_tool
        label: Manual
        accent: red
        format: integer
        tap_action:
          action: navigate
          navigation_path: '#oal-detail'
      - type: value
        entity: sensor.kitchen_humidity
        icon: water_drop
        label: Humidity
        accent: blue
        unit: '%'
        format: integer
      - type: value
        entity: sensor.aqi
        icon: air
        label: AQI
        accent: green
        format: integer
      - type: value
        entity: counter.tunet_hvac_cycles_today
        icon: repeat
        label: Cycles
        accent: blue
        format: integer
  - type: grid
    column_span: 4
    cards:
    - type: custom:tunet-actions-card
      name: OAL Mode
      compact: true
      grid_options:
        columns: full
      actions:
      - name: Adaptive
        icon: sunny
        accent: green
        service: input_select.select_option
        service_data:
          entity_id: input_select.oal_active_configuration
          option: Adaptive
        state_entity: input_select.oal_active_configuration
        active_when: Adaptive
      - name: Evening
        icon: bedtime
        accent: amber
        service: input_select.select_option
        service_data:
          entity_id: input_select.oal_active_configuration
          option: Evening
        state_entity: input_select.oal_active_configuration
        active_when: Evening
      - name: Dim
        icon: nightlight
        accent: purple
        service: input_select.select_option
        service_data:
          entity_id: input_select.oal_active_configuration
          option: Dim Ambient
        state_entity: input_select.oal_active_configuration
        active_when: Dim Ambient
      - name: Warm
        icon: local_fire_department
        accent: amber
        service: input_select.select_option
        service_data:
          entity_id: input_select.oal_active_configuration
          option: Warm Ambient
        state_entity: input_select.oal_active_configuration
        active_when: Warm Ambient
      - name: TV
        icon: tv
        accent: blue
        service: input_select.select_option
        service_data:
          entity_id: input_select.oal_active_configuration
          option: TV Mode
        state_entity: input_select.oal_active_configuration
        active_when: TV Mode
      - name: Sleep
        icon: hotel
        accent: purple
        service: input_select.select_option
        service_data:
          entity_id: input_select.oal_active_configuration
          option: Sleep
        state_entity: input_select.oal_active_configuration
        active_when: Sleep
  - type: grid
    column_span: 4
    cards:
    - type: custom:tunet-rooms-card
      name: Rooms
      layout_variant: row
      tile_size: compact
      grid_options:
        columns: full
      rooms:
      - name: Living
        icon: weekend
        tap_action:
          action: navigate
          navigation_path: '#room-living-room'
        lights:
        - entity: light.living_room_couch_lamp
          name: Couch
          icon: table_lamp
        - entity: light.living_room_floor_lamp
          name: Floor
          icon: floor_lamp
        - entity: light.living_room_spot_lights
          name: Spots
          icon: flashlight_on
        - entity: light.living_room_credenza_light
          name: Credenza
          icon: wb_incandescent
      - name: Kitchen
        icon: kitchen
        tap_action:
          action: navigate
          navigation_path: '#room-kitchen'
        lights:
        - entity: light.kitchen_island_pendants
          name: Island
          icon: light
        - entity: light.kitchen_main_lights
          name: Main
          icon: light_group
        - entity: light.kitchen_counter_cabinet_underlights
          name: Under
          icon: linear_scale
      - name: Dining
        icon: restaurant
        tap_action:
          action: navigate
          navigation_path: '#room-dining-room'
        lights:
        - entity: light.dining_room_spot_lights
          name: Spots
          icon: flashlight_on
        - entity: light.dining_column_strip_light_matter
          name: Column
          icon: view_column
      - name: Bedroom
        icon: bed
        tap_action:
          action: navigate
          navigation_path: '#room-bedroom'
        lights:
        - entity: light.master_presence
          name: Main
          icon: light
        - entity: light.master_bedroom_corner_accent_govee
          name: Accent
          icon: nightlight
        - entity: light.master_bedroom_table_lamps
          name: Lamps
          icon: lamp
      - name: Office
        icon: desktop_windows
        tap_action:
          action: navigate
          navigation_path: '#room-office'
        lights:
        - entity: light.office_desk_lamp
          name: Desk
          icon: lamp
        - entity: light.office_bed_lights
          name: Office Bed
          icon: bed
  - type: grid
    column_span: 4
    cards:
    - type: custom:tunet-climate-card
      entity: climate.dining_room
      name: Climate
      humidity_entity: sensor.kitchen_humidity
      grid_options:
        columns: 6
    - type: custom:tunet-weather-card
      entity: weather.home
      name: Weather
      forecast_view: auto
      forecast_metric: auto
      auto_precip_threshold: 45
      show_metric_toggle: false
      show_view_toggle: false
      show_last_updated: false
      forecast_days: 5
      forecast_hours: 6
      grid_options:
        columns: 6
  - type: grid
    column_span: 4
    cards:
    - type: custom:tunet-media-card
      entity: media_player.living_room
      name: Sonos
      show_progress: true
      grid_options:
        columns: 6
      tap_action:
        action: navigate
        navigation_path: '#media-living-room'
    - type: custom:tunet-actions-card
      name: Quick Actions
      compact: true
      grid_options:
        columns: 6
      actions:
      - name: All On
        icon: lightbulb
        accent: amber
        service: light.turn_on
        service_data:
          entity_id: light.all_adaptive_lights
        state_entity: light.all_adaptive_lights
        active_when: "on"
      - name: All Off
        icon: power_settings_new
        accent: amber
        service: light.turn_off
        service_data:
          entity_id: light.all_adaptive_lights
        state_entity: light.all_adaptive_lights
        active_when: "off"
      - name: Brighter
        icon: add
        accent: green
        service: script.oal_global_manual_brighter
      - name: Dimmer
        icon: remove
        accent: green
        service: script.oal_global_manual_dimmer
      - name: Reset
        icon: restart_alt
        accent: red
        service: script.turn_on
        service_data:
          entity_id: script.oal_reset_soft
        show_when:
          entity: sensor.oal_system_status
          attribute: active_zonal_overrides
          operator: gt
          state: 0
  - type: grid
    column_span: 4
    cards:
    - type: custom:tunet-inbox-card
      name: Inbox
      grid_options:
        columns: full
  - type: grid
    column_span: 4
    cards:
    - type: custom:bubble-card
