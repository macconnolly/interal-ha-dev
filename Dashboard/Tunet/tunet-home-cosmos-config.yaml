# =============================================================================
# Tunet Home v2 — Plan F build (2026-05-23 ultrathink approved)
# =============================================================================
# Plan: docs/plans/tunet-home-v2-interaction-spec-2026-05-23.md (approved 2ce7e22)
# Backend: commit 6caad51 (Evening rename + 19 new sensors)
#
# Composition per plan §4 + §11:
#   HOME view (sections grid, max_columns: 4)
#     - Status row (home_summary 4×2, 8 tiles)
#     - Scenes strip (3 scenes large: Adaptive / Evening / Dim Ambient)
#     - Rooms row (5 rooms, row variant with orbs + chevron)
#     - Now Playing mini-player
#     - Quick Lights (Counter + Entry direct tiles)
#     - Actions strip (Bedtime / Sleep / All Off)
#     - Inbox (conditional)
#
#   STATS view (HVAC + Electricity + Outside)
#   ADAPTIVE view (OAL mode timeline + per-zone snapshot)
#   POPUPS view (7 Bubble Card 3.2.1 standalone popups, hidden from sidebar)
#
# Interactions (Plan §1 + §5 per Apple HIG tap-vs-long-press):
#   Tap on rooms row body         → open #room-<name> Bubble popup
#   Tap on rooms orb              → toggle single light
#   Tap on rooms power icon       → toggle all room lights
#   Tap on status tile (Mode etc) → open #oal-detail popup
#   Tap on Now Playing            → open #media-living-room popup
#   Tap on scene chip             → activate scene
#   Tap on Quick Light tile       → toggle; long-drag → brightness
#
# Bubble Card popups styled with card_mod CSS for iOS-sheet feel
# (grabber + spring-ish transition + safe-area bottom inset).
# Mac's suggestion 2026-05-23 to style Bubble Card popups Apple-like
# rather than reverting to Browser Mod.
# =============================================================================

title: Tunet Home v2
icon: mdi:home
# Theme applies card-mod-root-yaml that hides HA native top tabs
# (Mac directive 2026-05-24). See Configuration/themes/tunet-cosmos.yaml.
theme: tunet-cosmos
views:
- title: Home
  path: home
  icon: mdi:home
  type: sections
  max_columns: 6
  dense_section_placement: true
  sections:
  # Top-nav strip — Mac directive: no HA native top tabs.
  - type: grid
    column_span: 4
    cards:
    - type: custom:tunet-actions-card
      name: ""
      compact: true
      grid_options:
        columns: full
      actions:
      - name: Home
        icon: home
        accent: blue
        tap_action:
          action: navigate
          navigation_path: /tunet-home-cosmos/home
      - name: Rooms
        icon: meeting_room
        accent: blue
        tap_action:
          action: navigate
          navigation_path: /tunet-home-cosmos/rooms
      - name: Media
        icon: speaker
        accent: blue
        tap_action:
          action: navigate
          navigation_path: /tunet-home-cosmos/media
      - name: Stats
        icon: insights
        accent: blue
        tap_action:
          action: navigate
          navigation_path: /tunet-home-cosmos/stats
      - name: Settings
        icon: settings
        accent: blue
        tap_action:
          action: navigate
          navigation_path: /tunet-home-cosmos/settings
  - type: grid
    column_span: 4
    cards:
    - type: custom:tunet-actions-card
      name: Quick Actions
      compact: true
      grid_options:
        columns: full
      actions:
      - name: All On
        icon: lightbulb
        accent: amber
        service: light.turn_on
        service_data:
          entity_id: light.all_adaptive_lights
        state_entity: light.all_adaptive_lights
        active_when: "on"
      - name: All Off
        icon: power_settings_new
        accent: amber
        service: light.turn_off
        service_data:
          entity_id: light.all_adaptive_lights
        state_entity: light.all_adaptive_lights
        active_when: "off"
      - name: Brighter
        icon: add
        accent: green
        service: script.oal_global_manual_brighter
      - name: Dimmer
        icon: remove
        accent: green
        service: script.oal_global_manual_dimmer
      - name: Adaptive
        icon: sunny
        accent: green
        service: input_select.select_option
        service_data:
          entity_id: input_select.oal_active_configuration
          option: Adaptive
        state_entity: input_select.oal_active_configuration
        active_when: Adaptive
      - name: Evening
        icon: bedtime
        accent: amber
        service: input_select.select_option
        service_data:
          entity_id: input_select.oal_active_configuration
          option: Evening
        state_entity: input_select.oal_active_configuration
        active_when: Evening
      - name: Dim
        icon: nightlight
        accent: purple
        service: input_select.select_option
        service_data:
          entity_id: input_select.oal_active_configuration
          option: Dim Ambient
        state_entity: input_select.oal_active_configuration
        active_when: Dim Ambient
      # R3 polish: Warm/TV/Sleep removed from primary strip per Mac's
      # "really only two or three modes I care about." Remain accessible
      # via OAL detail popup (#oal-detail) which exposes all 9 modes.
      - name: Reset
        icon: restart_alt
        accent: red
        service: script.turn_on
        service_data:
          entity_id: script.oal_reset_soft
        show_when:
          entity: sensor.oal_system_status
          attribute: active_zonal_overrides
          operator: gt
          state: 0
  - type: grid
    column_span: 4
    cards:
    # Status card matches polish-review home_summary (Mac validation 2026-05-23):
    # switched from manual tiles[] to recipe_tiles[] with use_profiles: true to
    # match /tunet-card-rehab-yaml/polish-review "Status Summary (Polish)".
    - type: custom:tunet-status-card
      name: Home Status
      layout_variant: home_summary
      show_header: true
      columns: 4
      tile_size: standard
      use_profiles: true
      grid_options:
        columns: full
      recipe_tiles:
      - recipe: home_presence
        entity: person.mac_connolly
      - recipe: lights_on
      - recipe: mode_selector
      - recipe: manual_overrides
        entity: sensor.oal_system_status
      - recipe: inside_temperature
        entity: sensor.dining_room_temperature
        action_entity: climate.dining_room
      - recipe: outside_temperature
      - recipe: outside_weather
      - recipe: inside_humidity
        entity: sensor.kitchen_humidity
      - recipe: now_playing
      - recipe: next_alarm
        entity: sensor.sonos_next_alarm
        compact_label: Bedroom
  - type: grid
    column_span: 4
    cards:
    - type: custom:tunet-lighting-card
      name: Lighting
      surface: card
      layout: grid
      tile_size: standard
      use_profiles: true
      columns: 2
      expand_groups: false
      show_adaptive_toggle: false
      primary_entity: sensor.oal_system_status
      zones:
      - entity: light.main_living_lights
        name: Living
        icon: weekend
      - entity: light.kitchen_main_lights
        name: Kitchen
        icon: kitchen
      - entity: light.bedroom_primary_lights
        name: Bedroom
        icon: bed
      - entity: light.accent_spots_lights
        name: Spots
        icon: highlight
      - entity: light.recessed_ceiling_lights
        name: Ceiling
        icon: light
      - entity: light.column_lights
        name: Columns
        icon: view_column
      grid_options:
        columns: full
        rows: auto
  # Climate + Weather — side-by-side on desktop (column_span: 2 each), auto-
  # stacks on phone (HA Sections collapses when 2x column_span: 2 don't fit).
  - type: grid
    column_span: 4
    cards:
    - type: custom:tunet-rooms-card
      name: Rooms
      layout_variant: row
      tile_size: compact
      grid_options:
        columns: full
        rows: auto
      rooms:
      - name: Living
        icon: weekend
        navigate_path: '#room-living-room'
        subview_path: /tunet-home-cosmos/living-room
        lights:
        - entity: light.living_room_couch_lamp
          name: Couch
          icon: table_lamp
        - entity: light.living_room_floor_lamp
          name: Floor
          icon: floor_lamp
        - entity: light.living_room_spot_lights
          name: Spots
          icon: flashlight_on
        - entity: light.living_room_credenza_light
          name: Credenza
          icon: wb_incandescent
        - entity: light.living_column_strip_light_matter
          name: Column
          icon: view_column
      - name: Kitchen
        icon: kitchen
        navigate_path: '#room-kitchen'
        subview_path: /tunet-home-cosmos/kitchen
        lights:
        - entity: light.kitchen_island_pendants
          name: Island
          icon: wb_incandescent
        - entity: light.kitchen_main_lights
          name: Main
          icon: light
        - entity: light.kitchen_counter_cabinet_underlights
          name: Under
          icon: linear_scale
      - name: Dining
        icon: restaurant
        navigate_path: '#room-dining-room'
        subview_path: /tunet-home-cosmos/dining-room
        lights:
        - entity: light.dining_room_spot_lights
          name: Spots
          icon: flashlight_on
        - entity: light.dining_column_strip_light_matter
          name: Column
          icon: view_column
      - name: Bedroom
        icon: bed
        navigate_path: '#room-bedroom'
        subview_path: /tunet-home-cosmos/bedroom
        lights:
        - entity: light.master_presence
          name: Main
          icon: light
        - entity: light.master_bedroom_table_lamps
          name: Lamps
          icon: lamp
      - name: Office
        icon: desktop_windows
        navigate_path: '#room-office'
        subview_path: /tunet-home-cosmos/office
        lights:
        - entity: light.office_desk_lamp
          name: Desk
          icon: lamp
        - entity: light.office_bed_lights
          name: Office Bed
          icon: bed
        - entity: light.master_bedroom_corner_accent_govee
          name: Accent
          icon: nightlight
  # Lighting functional zones grid (A.2 — 6 OAL zones for direct brightness
  # control without entering rooms). Tap = toggle; long-press / drag = brightness.
  - type: grid
    column_span: 2
    cards:
    - type: custom:tunet-climate-card
      entity: climate.dining_room
      name: Climate
      humidity_entity: sensor.kitchen_humidity
      variant: thin
      grid_options:
        columns: full
        rows: auto
  - type: grid
    column_span: 2
    cards:
    - type: custom:tunet-weather-card
      entity: weather.home
      name: Weather
      variant: thin
      forecast_view: auto
      forecast_metric: auto
      auto_precip_threshold: 45
      show_metric_toggle: false
      show_view_toggle: false
      show_last_updated: false
      forecast_days: 5
      forecast_hours: 4
      grid_options:
        columns: full
        rows: auto
  # Inbox positioned above mini-player (last persistent surface).
  - type: grid
    column_span: 4
    cards:
    - type: custom:tunet-media-card
      entity: media_player.living_room
      name: Now Playing
      show_progress: true
      grid_options:
        columns: full
        rows: auto
      tap_action:
        action: navigate
        navigation_path: '#media-living-room'
  # Inbox — column_span: 2 to pair with media on desktop when present;
  # tunet-inbox-card handles its own empty-state collapse.
  - type: grid
    column_span: 4
    cards:
    - type: custom:tunet-inbox-card
      name: Inbox
      grid_options:
        columns: full
  # Now Playing mini-player — pinned to bottom (last visible section before
