# =============================================================================
# Tunet Home v2 — Plan F build (2026-05-23 ultrathink approved)
# =============================================================================
# Plan: docs/plans/tunet-home-v2-interaction-spec-2026-05-23.md (approved 2ce7e22)
# Backend: commit 6caad51 (Evening rename + 19 new sensors)
#
# Composition per plan §4 + §11:
#   HOME view (sections grid, max_columns: 4)
#     - Status row (home_summary 4×2, 8 tiles)
#     - Scenes strip (3 scenes large: Adaptive / Evening / Dim Ambient)
#     - Rooms row (5 rooms, row variant with orbs + chevron)
#     - Now Playing mini-player
#     - Quick Lights (Counter + Entry direct tiles)
#     - Actions strip (Bedtime / Sleep / All Off)
#     - Inbox (conditional)
#
#   STATS view (HVAC + Electricity + Outside)
#   ADAPTIVE view (OAL mode timeline + per-zone snapshot)
#   POPUPS view (7 Bubble Card 3.2.1 standalone popups, hidden from sidebar)
#
# Interactions (Plan §1 + §5 per Apple HIG tap-vs-long-press):
#   Tap on rooms row body         → open #room-<name> Bubble popup
#   Tap on rooms orb              → toggle single light
#   Tap on rooms power icon       → toggle all room lights
#   Tap on status tile (Mode etc) → open #oal-detail popup
#   Tap on Now Playing            → open #media-living-room popup
#   Tap on scene chip             → activate scene
#   Tap on Quick Light tile       → toggle; long-drag → brightness
#
# Bubble Card popups styled with card_mod CSS for iOS-sheet feel
# (grabber + spring-ish transition + safe-area bottom inset).
# Mac's suggestion 2026-05-23 to style Bubble Card popups Apple-like
# rather than reverting to Browser Mod.
# =============================================================================

title: Tunet Home v2
icon: mdi:home
views:
- title: Home
  path: home
  icon: mdi:home
  type: sections
  max_columns: 4
  dense_section_placement: false
  sections:
  - type: grid
    column_span: 4
    cards:
    - type: custom:tunet-status-card
      layout_variant: home_summary
      name: Home Status
      columns: 4
      tile_size: compact
      grid_options:
        columns: full
      tiles:
      - type: value
        entity: sensor.oal_mode_current
        icon: tune
        label: Mode
        accent: green
        attribute: age_human
        tap_action:
          action: navigate
          navigation_path: '#oal-detail'
      - type: value
        entity: binary_sensor.hvac_running
        icon: hvac
        label: HVAC
        accent: blue
        format: state
        tap_action:
          action: more-info
          entity: climate.dining_room
      - type: value
        entity: sensor.dining_room_temperature
        icon: device_thermostat
        label: Inside
        accent: amber
        unit: °F
        format: integer
      - type: value
        entity: sensor.outside_temperature
        icon: cloud
        label: Outside
        accent: blue
        unit: °F
        format: integer
      - type: value
        entity: sensor.oal_override_count_active
        icon: pan_tool
        label: Manual
        accent: red
        format: integer
        tap_action:
          action: navigate
          navigation_path: '#oal-detail'
      - type: value
        entity: sensor.kitchen_humidity
        icon: water_drop
        label: Humidity
        accent: blue
        unit: '%'
        format: integer
      - type: value
        entity: sensor.aqi
