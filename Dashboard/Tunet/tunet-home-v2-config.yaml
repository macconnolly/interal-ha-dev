          }\nha-card::before {\n  content: '';\n  position: absolute;\n  top: 8px; left: 50%;\n  transform: translateX(-50%);\n  width: 36px; height: 5px;\n  border-radius: 3px;\n  background: rgba(255,255,255,0.4);\n\
          \  pointer-events: none;\n}\n"
