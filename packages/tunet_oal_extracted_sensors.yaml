      # ─── Global brightness offsets (5 sensors) ─────────────────────────
      # Source: live verification showed b_environmental_offset=15 matches
      # state "Boosted" + boost_source "☀️+15%". v2 plan claimed 4 globals;
      # live probe found a 5th (b_night_offset) — exposed for night-phase visibility.
      - name: "OAL Offset Environmental"
        unique_id: "tunet_oal_offset_environmental_pct"
        icon: mdi:weather-partly-cloudy
        unit_of_measurement: "%"
        state_class: measurement
        state: >
          {{ state_attr('sensor.oal_real_time_monitor', 'b_environmental_offset') | float(none) | round(1) }}

