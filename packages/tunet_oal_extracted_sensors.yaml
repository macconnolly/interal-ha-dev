      - name: "OAL Offset Night"
        unique_id: "tunet_oal_offset_night_pct"
        icon: mdi:weather-night
        unit_of_measurement: "%"
        state_class: measurement
        state: >
          {{ state_attr('sensor.oal_real_time_monitor', 'b_night_offset') | float(none) | round(1) }}

      # Total offset = sum of all 4 brightness offsets. Replaces the
      # existing string-state sensor.oal_global_brightness_offset ("+15%")
      # with a numeric graphable equivalent.
      - name: "OAL Offset Total"
        unique_id: "tunet_oal_offset_total_pct"
        icon: mdi:sigma
        unit_of_measurement: "%"
        state_class: measurement
        state: >
          {% set env = state_attr('sensor.oal_real_time_monitor', 'b_environmental_offset') | float(0) %}
          {% set sun = state_attr('sensor.oal_real_time_monitor', 'b_sunset_offset') | float(0) %}
          {% set cfg = state_attr('sensor.oal_real_time_monitor', 'b_config_offset') | float(0) %}
          {% set ngt = state_attr('sensor.oal_real_time_monitor', 'b_night_offset') | float(0) %}
          {{ (env + sun + cfg + ngt) | round(1) }}

      # ─── Environmental lux (S.1c #4) ────────────────────────────────────
      # Pulled from sensor.oal_environmental_debug.lux_current. Co-located
      # in this OAL extraction package since it's an OAL diagnostic value.
      - name: "OAL Lux Current"
        unique_id: "tunet_oal_lux_current"
        icon: mdi:brightness-5
        unit_of_measurement: "lx"
        device_class: illuminance
        state_class: measurement
        state: >
          {{ state_attr('sensor.oal_environmental_debug', 'lux_current') | float(none) | round(0) }}
